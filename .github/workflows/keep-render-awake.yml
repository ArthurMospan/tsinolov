name: Keep Render tracker awake

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify tracker
        run: curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 90 https://tsinolov.onrender.com/health
